<svg width="512" height="512" viewBox="30 20 160 140" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Clean gradient for depth -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>
  
  <!-- Person Head - perfect circle -->
  <circle 
    cx="80" 
    cy="60" 
    r="18" 
    fill="url(#orangeGradient)"
  />
  
  <!-- Person Body - rounded torso shape -->
  <path 
    d="M 55 80 
       Q 55 95 55 115 
       Q 55 130 65 135 
       Q 80 140 95 135 
       Q 105 130 105 115 
       Q 105 95 105 80 
       Q 100 78 80 78 
       Q 60 78 55 80 Z" 
    fill="url(#orangeGradient)"
  />
  
  <!-- Heart - larger, more prominent white heart -->
  <path 
    d="M 80 95 
       L 70 85 
       Q 65 80 65 75 
       Q 65 68 70 68 
       Q 75 68 80 73 
       Q 85 68 90 68 
       Q 95 68 95 75 
       Q 95 80 90 85 
       L 80 95 Z" 
    fill="#FFFFFF"
    stroke="#D2691E"
    stroke-width="2"
  />
  
  <!-- Signal waves - positioned near head, perfectly spaced -->
  <path 
    d="M 120 48 Q 130 54 130 62 Q 130 70 120 76" 
    stroke="url(#orangeGradient)"
    stroke-width="8" 
    fill="none" 
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path 
    d="M 135 40 Q 148 50 148 62 Q 148 74 135 84" 
    stroke="url(#orangeGradient)"
    stroke-width="7" 
    fill="none" 
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path 
    d="M 150 32 Q 166 46 166 62 Q 166 78 150 92" 
    stroke="url(#orangeGradient)"
    stroke-width="6" 
    fill="none" 
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
